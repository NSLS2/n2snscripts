---
# Canonical CI lint gate. Runs the committed .pre-commit-config.yaml
# (the same hook set developers run locally) against changed files only.
#
# Changed-file scope:
#   pull_request    -> files changed vs. the PR base (origin/main).
#   push to main    -> files changed in the push (github.event.before..HEAD).
#   workflow_dispatch -> all files (no push range available; safe fallback).

name: Lint

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (changed files)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f  # v0.10.0
        with:
          pixi-version: v0.71.3
          cache: false
          frozen: true
          environments: dev

      - name: Determine changed-file ref range
        id: refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "from_ref=origin/${BASE_REF}" >> "$GITHUB_OUTPUT"
            echo "to_ref=${SHA}"               >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            # On branch creation, $BEFORE is 40 zeros; after force-push, the old SHA
            # may be unfetchable. Both break pre-commit --from-ref, so fall back to --all-files.
            if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              echo "from_ref=" >> "$GITHUB_OUTPUT"
              echo "to_ref="   >> "$GITHUB_OUTPUT"
            else
              echo "from_ref=${BEFORE}" >> "$GITHUB_OUTPUT"
              echo "to_ref=${SHA}"      >> "$GITHUB_OUTPUT"
            fi
          else
            # workflow_dispatch: lint everything
            echo "from_ref=" >> "$GITHUB_OUTPUT"
            echo "to_ref="   >> "$GITHUB_OUTPUT"
          fi

      - name: Collect tool versions
        id: versions
        run: |
          # Extract versions from pixi dev environment
          RUFF_VER=$(pixi list -e dev --json | jq -r '.[] | select(.name=="ruff") | .version')
          MYPY_VER=$(pixi list -e dev --json | jq -r '.[] | select(.name=="mypy") | .version')
          CODESPELL_VER=$(pixi list -e dev --json | jq -r '.[] | select(.name=="codespell") | .version')
          YAMLLINT_VER=$(pixi list -e dev --json | jq -r '.[] | select(.name=="yamllint") | .version')
          ZIZMOR_VER=$(pixi list -e dev --json | jq -r '.[] | select(.name=="zizmor") | .version')

          # Extract versions from .pre-commit-config.yaml rev: tags
          # (strip wrapper-specific build suffixes where applicable)
          PRECOMMIT_HOOKS_VER=$(grep -A1 'repo: https://github.com/pre-commit/pre-commit-hooks' .pre-commit-config.yaml | grep 'rev:' | awk '{print $2}')
          MARKDOWNLINT_VER=$(grep -A1 'repo: https://github.com/igorshubovych/markdownlint-cli' .pre-commit-config.yaml | grep 'rev:' | awk '{print $2}')
          ACTIONLINT_VER=$(grep -A1 'repo: https://github.com/rhysd/actionlint' .pre-commit-config.yaml | grep 'rev:' | awk '{print $2}')
          # shfmt: pre-commit-shfmt adds -N build numbers (v3.12.0-2 -> v3.12.0)
          SHFMT_VER=$(grep -A1 'repo: https://github.com/scop/pre-commit-shfmt' .pre-commit-config.yaml | grep 'rev:' | awk '{print $2}' | sed 's/-[0-9]\+$//')
          # shellcheck-py: Python wrapper adds .N to upstream shellcheck version (v0.11.0.1 -> v0.11.0)
          SHELLCHECK_VER=$(grep -A1 'repo: https://github.com/shellcheck-py/shellcheck-py' .pre-commit-config.yaml | grep 'rev:' | awk '{print $2}' | sed 's/\.[0-9]\+$//')
          GITLEAKS_VER=$(grep -A1 'repo: https://github.com/gitleaks/gitleaks' .pre-commit-config.yaml | grep 'rev:' | awk '{print $2}')

          # Write to GITHUB_OUTPUT
          {
            echo "ruff=$RUFF_VER"
            echo "mypy=$MYPY_VER"
            echo "codespell=$CODESPELL_VER"
            echo "yamllint=$YAMLLINT_VER"
            echo "zizmor=$ZIZMOR_VER"
            echo "precommit_hooks=$PRECOMMIT_HOOKS_VER"
            echo "markdownlint=$MARKDOWNLINT_VER"
            echo "actionlint=$ACTIONLINT_VER"
            echo "shfmt=$SHFMT_VER"
            echo "shellcheck=$SHELLCHECK_VER"
            echo "gitleaks=$GITLEAKS_VER"
          } >> "$GITHUB_OUTPUT"

      - name: Run pre-commit (changed files)
        id: pre_commit
        env:
          FROM_REF: ${{ steps.refs.outputs.from_ref }}
          TO_REF: ${{ steps.refs.outputs.to_ref }}
        run: |
          set -o pipefail
          if [[ -n "$FROM_REF" ]]; then
            pixi run -e dev pre-commit run \
              --from-ref "$FROM_REF" \
              --to-ref   "$TO_REF"   \
              --show-diff-on-failure \
              --color always \
              2>&1 | tee /tmp/pre-commit-output.txt
          else
            pixi run -e dev pre-commit run \
              --all-files \
              --show-diff-on-failure \
              --color always \
              2>&1 | tee /tmp/pre-commit-output.txt
          fi

      - name: Write job summary
        if: always()
        env:
          PRE_COMMIT_OUTCOME: ${{ steps.pre_commit.outcome }}
          FROM_REF: ${{ steps.refs.outputs.from_ref }}
          TO_REF: ${{ steps.refs.outputs.to_ref }}
          RUFF_VER: ${{ steps.versions.outputs.ruff }}
          MYPY_VER: ${{ steps.versions.outputs.mypy }}
          CODESPELL_VER: ${{ steps.versions.outputs.codespell }}
          YAMLLINT_VER: ${{ steps.versions.outputs.yamllint }}
          ZIZMOR_VER: ${{ steps.versions.outputs.zizmor }}
          PRECOMMIT_HOOKS_VER: ${{ steps.versions.outputs.precommit_hooks }}
          MARKDOWNLINT_VER: ${{ steps.versions.outputs.markdownlint }}
          ACTIONLINT_VER: ${{ steps.versions.outputs.actionlint }}
          SHFMT_VER: ${{ steps.versions.outputs.shfmt }}
          SHELLCHECK_VER: ${{ steps.versions.outputs.shellcheck }}
          GITLEAKS_VER: ${{ steps.versions.outputs.gitleaks }}
        run: |
          if [[ "$PRE_COMMIT_OUTCOME" == "success" ]]; then
            BADGE="All linting hooks passed"
          else
            BADGE="One or more linting hooks failed"
          fi

          if [[ -n "$FROM_REF" ]]; then
            SCOPE="\`${FROM_REF}\`..\`${TO_REF}\`"
          else
            SCOPE="all files (workflow_dispatch)"
          fi

          {
            echo "## Lint results"
            echo ""
            echo "$BADGE"
            echo ""
            echo "**Scope:** changed files — ${SCOPE}"
            echo ""
            echo "### Hooks run"
            echo ""
            echo "| Hook | Tool | Version |"
            echo "| ---- | ---- | ------- |"
            echo "| trailing-whitespace / end-of-file-fixer / check-* | pre-commit-hooks | ${PRECOMMIT_HOOKS_VER} |"
            echo "| ruff check + ruff format | ruff | ${RUFF_VER} |"
            echo "| mypy | mypy | ${MYPY_VER} |"
            echo "| codespell | codespell | ${CODESPELL_VER} |"
            echo "| markdownlint | markdownlint-cli | ${MARKDOWNLINT_VER} |"
            echo "| yamllint | yamllint | ${YAMLLINT_VER} |"
            echo "| actionlint | actionlint | ${ACTIONLINT_VER} |"
            echo "| zizmor | zizmor | ${ZIZMOR_VER} |"
            echo "| shfmt | shfmt | ${SHFMT_VER} |"
            echo "| shellcheck | shellcheck | ${SHELLCHECK_VER} |"
            echo "| gitleaks | gitleaks | ${GITLEAKS_VER} |"
            echo ""
            if [[ -s /tmp/pre-commit-output.txt ]]; then
              echo "### Output"
              echo ""
              echo '```'
              sed 's/\x1b\[[0-9;]*m//g' /tmp/pre-commit-output.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
