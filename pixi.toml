[workspace]
authors = []
channels = ["conda-forge"]
description = "NSLS-II system scripts and shell libraries"
name = "n2snscripts"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[dependencies]
# Runtime interpreter for azoidcapp (stdlib only; no extra packages needed).
# Capped at <3.14 to avoid packaging issues with the Python 3.14
# free-threaded (3.14t) variant.
python = ">=3.9,<3.14"

[environments]
dev = { features = ["dev"] }

[feature.dev.dependencies]
prek = "*"
# Tool versions are pinned so developer environments are deterministic
# and stay in lockstep with the .pre-commit-config.yaml hook set
# (both locally and in CI via the Lint workflow).
# When upgrading any of these, also update the matching `rev:` pins
# in .pre-commit-config.yaml if applicable.
ruff = "==0.15.8"
codespell = "==2.4.2"
yamllint = "==1.38.0"
zizmor = "==1.23.1"
mypy = "*"

[feature.dev.tasks]
lint = "prek run --all-files"
lint-files = "prek run --files"
